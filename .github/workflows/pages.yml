name: Demo page

# Builds the WebAssembly (Pyodide) wheel of colorcorrect, assembles the
# browser demo in docs/ with it and publishes everything to GitHub Pages.
# Repository settings -> Pages -> Source must be "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build the Pyodide wheel
        id: wheel
        continue-on-error: true   # the demo still works without the extension
        run: |
          python -m pip install cibuildwheel==4.3.5
          python -m cibuildwheel --platform pyodide --output-dir wheelhouse
          ls -l wheelhouse
      - name: Assemble the site
        run: |
          mkdir -p _site/colorcorrect _site/wheels
          cp docs/index.html _site/
          cp src/colorcorrect/__init__.py src/colorcorrect/algorithm.py _site/colorcorrect/
          wheel=$(ls wheelhouse/*.whl 2>/dev/null | head -n 1 || true)
          if [ -n "$wheel" ]; then
            cp "$wheel" _site/wheels/
            echo "{\"wheel\": \"$(basename "$wheel")\"}" > _site/wheels/manifest.json
          else
            echo '{}' > _site/wheels/manifest.json
          fi
          cat _site/wheels/manifest.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
